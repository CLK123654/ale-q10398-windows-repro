name: windows-2025

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true

      - name: Run independent verification
        shell: pwsh
        run: npm run verify

      - name: Upload Windows evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: q10398-windows-evidence
          path: verification/evidence/
          if-no-files-found: error
          retention-days: 1
